config_cls: AuKPipelineConfig
# AuK weights (auk_base.safetensors + vae.safetensors + config.yaml). The
# Qwen2.5-Omni-3B encoder is downloaded as a separate checkpoint.
model_path: tencent/AuK

stages:
  preprocessing:
    factory:
      max_concurrency: 8
  auk_engine:
    factory:
      dtype: bfloat16
      text_encoder_path: Qwen/Qwen2.5-Omni-3B
      # Base recipe. AuK-Flash checkpoints ignore these and force NFE=4/CFG=0.
      nfe: 32
      cfg_strength: 2.0
      sway_sampling_coef: -1.0
      max_seconds: 30
    gpu: 0
